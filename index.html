<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKF Korea AI App Hub</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:            #FAFBFC;
  --bg-dark:       #F0F2F5;
  --surface:       #FFFFFF;
  --border:        #E1E4E8;
  --border-light:  #EAEEF2;
  --border-strong: #D1D5DB;
  --text:          #0D1117;
  --text-2:        #57606A;
  --text-3:        #8B949E;
  --accent-fg:     #FFFFFF;
  --green:         #1A7F37;
  --green-bg:      #F0FDF4;
  --green-bd:      #86EFAC;
  --yellow:        #BF8700;
  --yellow-bg:     #FEF3C7;
  --yellow-bd:     #FCD34D;
  --blue:          #0969DA;
  --blue-bg:       #F0F6FC;
  --blue-bd:       #79C0FF;
  --red:           #D1242F;
  --red-bg:        #FFEBE9;
  --red-bd:        #FF8182;
  --font:          'IBM Plex Sans KR', sans-serif;
  --mono:          'IBM Plex Mono', monospace;
  --radius:        8px;
  --radius-lg:     12px;
  --shadow-sm:     0 1px 3px rgba(13,17,23,.12);
  --shadow-md:     0 8px 24px rgba(13,17,23,.12);
  --shadow-lg:     0 12px 32px rgba(13,17,23,.15);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: linear-gradient(to bottom, var(--bg), #fefeff);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* =========================
   Header
   ========================= */
.app-header {
  background: var(--text); color: var(--accent-fg);
  padding: 16px 32px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  border-bottom: none;
  box-shadow: 0 2px 8px rgba(13,17,23,.12);
}
.app-header-left { display: flex; align-items: center; gap: 16px; }
.app-logo {
  width: 36px; height: 36px;
  background: var(--accent-fg);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.app-logo svg { width: 22px; height: 22px; }
.app-title { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.app-sub   { font-size: 12px; color: rgba(255,255,255,.65); margin-top: 2px; letter-spacing: .01em; }
.app-badge {
  font-size: 11px; font-weight: 600;
  background: rgba(255,255,255,.15);
  padding: 5px 12px; border-radius: 20px;
  letter-spacing: .06em;
  border: 1px solid rgba(255,255,255,.1);
}

/* =========================
   Layout
   ========================= */
.app-body {
  max-width: 1320px; margin: 0 auto;
  padding: 48px 32px 100px;
}

/* Hero section */
.hero {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 32px; flex-wrap: wrap;
  margin-bottom: 40px;
  padding-bottom: 0;
  border-bottom: none;
}
.hero-left { flex: 1; min-width: 280px; }
.hero-eyebrow {
  font-family: var(--mono);
  font-size: 11px; font-weight: 600;
  letter-spacing: .14em;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.hero-title {
  font-size: 36px; font-weight: 700;
  letter-spacing: -.02em; line-height: 1.2;
  color: var(--text);
  margin-bottom: 12px;
}
.hero-desc {
  font-size: 14px; line-height: 1.7;
  color: var(--text-2);
  max-width: 600px;
}

/* Stats strip */
.stats {
  display: flex; gap: 0;
  border: none;
  border-radius: var(--radius-lg);
  background: var(--surface);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.stat {
  padding: 16px 24px;
  border-right: 1px solid var(--border);
  min-width: 100px;
  flex: 1;
}
.stat:last-child { border-right: 0; }
.stat-num {
  font-family: var(--mono);
  font-size: 24px; font-weight: 700;
  letter-spacing: -.02em;
  color: var(--text);
  line-height: 1;
}
.stat-label {
  margin-top: 6px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-3);
}

/* =========================
   Filter bar
   ========================= */
.filter-bar {
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 32px;
}
.filter-label {
  font-family: var(--mono);
  font-size: 11px; font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-right: 4px;
}
.filter-chip {
  font-family: var(--font);
  font-size: 13px; font-weight: 500;
  padding: 8px 16px;
  border-radius: 24px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--text-2);
  cursor: pointer;
  transition: all .2s ease;
  user-select: none;
}
.filter-chip:hover {
  border-color: var(--blue);
  color: var(--blue);
  background: var(--bg-dark);
}
.filter-chip.active {
  background: var(--blue);
  border-color: var(--blue);
  color: var(--accent-fg);
  box-shadow: 0 4px 12px rgba(9,105,218,.2);
}
.filter-chip .count {
  font-family: var(--mono);
  font-size: 11px;
  opacity: .65;
  margin-left: 6px;
  font-weight: 600;
}
.filter-chip.active .count { opacity: .8; }

/* =========================
   Agent grid
   ========================= */
.agent-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
@media (max-width: 900px) {
  .agent-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }
}
@media (max-width: 600px) {
  .agent-grid { grid-template-columns: 1fr; gap: 16px; }
  .app-body { padding: 24px 16px 60px; }
  .hero-title { font-size: 28px; }
  .stats { width: 100%; }
}

.agent-card {
  position: relative;
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  cursor: pointer;
  transition: all .25s ease;
  text-decoration: none; color: inherit;
  min-height: 220px;
  overflow: hidden;
}
.agent-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--blue);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .3s ease;
}
.agent-card:hover {
  border-color: var(--blue);
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
}
.agent-card:hover::before { transform: scaleX(1); }

.agent-card.disabled {
  cursor: default;
  opacity: .65;
}
.agent-card.disabled:hover {
  transform: none;
  border-color: var(--border);
  box-shadow: none;
}
.agent-card.disabled:hover::before { transform: scaleX(0); }

.card-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
}
.card-icon {
  width: 44px; height: 44px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--blue), #0861ca);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.card-icon svg { width: 22px; height: 22px; stroke: var(--accent-fg); fill: none; stroke-width: 1.5; }

.card-status {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono);
  font-size: 10px; font-weight: 700;
  letter-spacing: .1em;
  padding: 5px 10px;
  border-radius: 20px;
  text-transform: uppercase;
}
.status-live {
  background: var(--green-bg);
  border: 1px solid var(--green-bd);
  color: var(--green);
}
.status-live::before {
  content: ""; width: 6px; height: 6px;
  background: var(--green); border-radius: 50%;
  animation: pulse 2s infinite;
}
.status-m365 {
  background: var(--blue-bg);
  border: 1px solid var(--blue-bd);
  color: var(--blue);
}
.status-soon {
  background: var(--bg-dark);
  border: 1px solid var(--border-strong);
  color: var(--text-3);
}
.status-local {
  background: var(--yellow-bg);
  border: 1px solid var(--yellow-bd);
  color: var(--yellow);
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}

.card-title {
  font-size: 16px; font-weight: 700;
  letter-spacing: -.01em;
  line-height: 1.35;
  color: var(--text);
  margin-bottom: 8px;
}
.card-desc {
  font-size: 13px;
  line-height: 1.75;
  color: var(--text-2);
  flex: 1;
}

.card-desc p {
  margin: 0 0 12px;
}

.card-desc p:last-child {
  margin-bottom: 0;
}

.card-link {
  color: var(--blue);
  text-decoration: none;
  font-weight: 700;
  cursor: pointer;
}

.card-link:hover {
  text-decoration: underline;
}

.card-foot {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
}
.card-tag {
  font-family: var(--mono);
  font-size: 10px; font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-3);
}
.card-arrow {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--mono);
  font-size: 11px; font-weight: 700;
  letter-spacing: .08em;
  color: var(--blue);
  text-transform: uppercase;
  transition: gap .2s ease;
}
.agent-card:hover .card-arrow { 
  gap: 10px;
  color: var(--blue);
}
.card-arrow svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }

.agent-card.disabled .card-arrow {
  color: var(--text-3);
}

/* =========================
   Footer
   ========================= */
.app-footer {
  margin-top: 80px;
  padding-top: 32px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  gap: 20px; flex-wrap: wrap;
}
.footer-left {
  font-size: 12px; color: var(--text-3);
  font-family: var(--mono);
  letter-spacing: .04em;
  font-weight: 500;
}
.footer-right {
  font-size: 12px; color: var(--text-3);
  font-weight: 500;
}

/* Hidden state for filtered cards */
.agent-card.hidden {
  display: none;
}

/* Loading skeleton */
.skeleton-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
@media (max-width: 900px) { .skeleton-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; } }
@media (max-width: 600px) { .skeleton-grid { grid-template-columns: 1fr; gap: 16px; } }
.skeleton-card {
  height: 220px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);
  background: linear-gradient(90deg, var(--surface) 0%, var(--bg-dark) 50%, var(--surface) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.6s infinite ease-in-out;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* Error box */
.error-box {
  border: 1.5px solid var(--red-bd);
  background: var(--red-bg);
  border-radius: var(--radius-lg);
  padding: 24px;
  color: var(--red);
}
.error-box h3 { font-size: 14px; margin-bottom: 8px; }
.error-box p  { font-size: 13px; line-height: 1.7; color: var(--text); }
.error-box code {
  font-family: var(--mono);
  font-size: 12px;
  background: rgba(255,255,255,.6);
  padding: 2px 6px;
  border-radius: 3px;
}

/* Section heading (optional, used between groups) */
.section-divider {
  margin: 36px 0 20px;
  display: flex; align-items: center; gap: 16px;
}
.section-divider-label {
  font-family: var(--mono);
  font-size: 12px; font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--blue);
  white-space: nowrap;
}
.section-divider-line {
  flex: 1; height: 1px; background: linear-gradient(to right, var(--border), transparent);
}
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-left">
    <div class="app-logo">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="7" height="7" fill="#1A1917"/>
        <rect x="11" y="2" width="7" height="7" fill="#1A1917"/>
        <rect x="2" y="11" width="7" height="4" fill="#1A1917"/>
        <rect x="11" y="11" width="7" height="4" fill="#1A1917"/>
        <rect x="2" y="17" width="16" height="2" fill="#1A1917"/>
      </svg>
    </div>
    <div>
      <div class="app-title">SKF Korea AI App Hub</div>
      <div class="app-sub">SKF Korea · BaaS / DX Initiative · App Hub</div>
    </div>
  </div>
  <div class="app-badge" id="appBadge">Loading…</div>
</header>

<div class="app-body">

  <!-- Hero -->
  <section class="hero">
    <div class="hero-left">
      <div class="hero-eyebrow">App Hub · 업무 자동화</div>
      <h1 class="hero-title">SKF Korea AI App Hub</h1>
      <p class="hero-desc">
        SKF Korea의 임직원을 위한 AI 앱 허브입니다.
        생산성 도구부터 영업 지원, 운영 자동화까지 한 곳에서 만나세요.
      </p>
    </div>
    <div class="stats" id="statsBar">
      <div class="stat"><div class="stat-num">—</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-num">—</div><div class="stat-label">Live</div></div>
      <div class="stat"><div class="stat-num">—</div><div class="stat-label">M365</div></div>
      <div class="stat"><div class="stat-num">—</div><div class="stat-label">Soon</div></div>
    </div>
  </section>

  <!-- Filter -->
  <div class="filter-bar" id="filterBar">
    <span class="filter-label">Filter</span>
    <!-- chips injected by JS -->
  </div>

  <!-- Content area: loading / error / grid -->
  <div id="content">
    <div class="skeleton-grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-left">DX · Internal Use Only</div>
    <div class="footer-right">문의: 백승규 이사 · DX Manager</div>
  </footer>

</div>

<script>
/* =========================================================
   Icon library — semantic name → SVG path content
   ========================================================= */
const ICONS = {
  'airplane':       '<path d="M2 12L22 5L15 22L12 14L4 11L2 12Z" stroke-linejoin="round"/><path d="M12 14L19 7" stroke-linecap="round"/>',
  'document-split': '<path d="M14 3H6C5 3 4 4 4 5V19C4 20 5 21 6 21H18C19 21 20 20 20 19V9L14 3Z" stroke-linejoin="round"/><path d="M14 3V9H20" stroke-linejoin="round"/><path d="M8 13H16M8 17H13" stroke-linecap="round"/>',
  'leaf':           '<path d="M12 3C8 7 5 10 5 14C5 18 8 21 12 21C16 21 19 18 19 14C19 10 16 7 12 3Z" stroke-linejoin="round"/><path d="M12 21V11M12 14L9 12M12 17L15 15" stroke-linecap="round"/>',
  'chat-bubble':    '<path d="M21 12C21 16 17 19 12 19C10.8 19 9.6 18.8 8.6 18.5L4 20L5.5 16C4.6 14.8 4 13.5 4 12C4 8 8 5 12 5C17 5 21 8 21 12Z" stroke-linejoin="round"/><circle cx="9" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="13" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="17" cy="12" r="1" fill="currentColor" stroke="none"/>',
  'chart-bar':      '<path d="M4 20H20M6 16V10M10 16V6M14 16V12M18 16V8" stroke-linecap="round" stroke-linejoin="round"/>',
  'document-page':  '<path d="M4 5H20V19H4V5Z" stroke-linejoin="round"/><path d="M8 8H16M8 12H16M8 16H12" stroke-linecap="round"/>',
  'speech-bubble':  '<path d="M4 4H20V16H12L8 20V16H4V4Z" stroke-linejoin="round"/><path d="M8 10H16M8 14H13" stroke-linecap="round"/>',
  'layout-grid':    '<rect x="3" y="3" width="18" height="18" rx="2" stroke-linejoin="round"/><path d="M3 9H21M9 21V9" stroke-linejoin="round"/><path d="M14 13L16 15L19 12" stroke-linecap="round" stroke-linejoin="round"/>',
  'bookmark':       '<path d="M6 3H18V21L12 17L6 21V3Z" stroke-linejoin="round"/><path d="M9 9L11 11L15 7" stroke-linecap="round" stroke-linejoin="round"/>',
  'package':        '<path d="M3 7L12 3L21 7V17L12 21L3 17V7Z" stroke-linejoin="round"/><path d="M3 7L12 11L21 7M12 11V21" stroke-linejoin="round"/>',
  'lightbulb':      '<path d="M9 18H15M10 21H14M12 3C8 3 6 6 6 9C6 11 7 12.5 8 13.5C9 14.5 9 15 9 16H15C15 15 15 14.5 16 13.5C17 12.5 18 11 18 9C18 6 16 3 12 3Z" stroke-linecap="round" stroke-linejoin="round"/>',
  'compass':        '<path d="M4 21V19C4 16 7 14 12 14C17 14 20 16 20 19V21" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="8" r="4"/>',
  'default':        '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9H15M9 13H15M9 17H13"/>'
};

/* =========================================================
   Status → CSS class mapping
   ========================================================= */
const STATUS_CLASS = {
  'Live':        'status-live',
  'M365':        'status-m365',
  'Beta':        'status-live',
  'Alpha':       'status-live',
  'Coming Soon': 'status-soon',
  'Sunset':      'status-soon',
  'Deprecated':  'status-soon'
};

/* =========================================================
   Helpers
   ========================================================= */
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
}[c]));

const iconSvg = (name) => `
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    ${ICONS[name] || ICONS['default']}
  </svg>`;

/* =========================================================
   Description renderer
   - 단일 단락이면 plain text, 여러 단락이면 <p> wrapping
   - extra_action이 있으면 마지막 단락 끝에 인라인 링크 추가
   ========================================================= */
function renderDescription(app) {
  const desc = app.description || '';
  const paragraphs = desc.includes('\n\n')
    ? desc.split('\n\n').map(p => p.trim()).filter(Boolean)
    : [desc];

  // 단일 단락 + extra_action 없음 → 평문
  if (paragraphs.length === 1 && !app.extra_action) {
    return escapeHtml(paragraphs[0]);
  }

  // 다단락 또는 extra_action 있음 → <p> wrapping
  return paragraphs.map((p, i) => {
    const isLast = i === paragraphs.length - 1;
    if (isLast && app.extra_action) {
      const ea = app.extra_action;
      const safeUrl = escapeHtml(ea.url);
      const safeText = escapeHtml(ea.text);
      const link = `<span class="card-link" onclick="event.preventDefault(); event.stopPropagation(); window.open('${safeUrl}', '_blank');">${safeText}</span>`;
      return `<p>${escapeHtml(p)} ${link}</p>`;
    }
    return `<p>${escapeHtml(p)}</p>`;
  }).join('');
}

/* =========================================================
   Card renderer
   ========================================================= */
function renderCard(app) {
  const hasLink = !!app.url && app.status !== 'Coming Soon';
  const statusClass = STATUS_CLASS[app.status] || 'status-soon';
  const tag = hasLink ? 'a' : 'div';
  const linkAttrs = hasLink
    ? `href="${escapeHtml(app.url)}" target="_blank" rel="noopener"`
    : '';
  const disabledCls = hasLink ? '' : ' disabled';
  const arrowLabel = hasLink ? 'Open' : 'Soon';
  const arrowIcon = hasLink
    ? '<svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H8M17 7V16" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    : '<svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7V12L15 14"/></svg>';

  return `
    <${tag} class="agent-card${disabledCls}" data-cat="${escapeHtml(app.category)}" ${linkAttrs}>
      <div class="card-head">
        <div class="card-icon">${iconSvg(app.icon)}</div>
        <span class="card-status ${statusClass}">${escapeHtml(app.status)}</span>
      </div>
      <div class="card-title">${escapeHtml(app.name)}</div>
      <div class="card-desc">${renderDescription(app)}</div>
      <div class="card-foot">
        <span class="card-tag">${escapeHtml(app.category)}</span>
        <span class="card-arrow">${arrowLabel}${arrowIcon}</span>
      </div>
    </${tag}>
  `;
}

/* =========================================================
   Stats updater
   ========================================================= */
function renderStats(apps) {
  const total = apps.length;
  const live  = apps.filter(a => a.status === 'Live').length;
  const m365  = apps.filter(a => a.status === 'M365' || a.platform === 'M365 Copilot Studio').length;
  const soon  = apps.filter(a => a.status === 'Coming Soon').length;

  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-num">${live}</div><div class="stat-label">Live</div></div>
    <div class="stat"><div class="stat-num">${m365}</div><div class="stat-label">M365</div></div>
    <div class="stat"><div class="stat-num">${soon}</div><div class="stat-label">Soon</div></div>
  `;
  document.getElementById('appBadge').textContent = `v2.0 · ${total} Apps`;
}

/* =========================================================
   Filter chips renderer
   ========================================================= */
function renderFilters(apps, categoryLabels) {
  const counts = {};
  apps.forEach(a => { counts[a.category] = (counts[a.category] || 0) + 1; });

  const bar = document.getElementById('filterBar');
  const chips = [
    `<div class="filter-chip active" data-filter="all">전체 <span class="count">${apps.length}</span></div>`
  ];
  Object.entries(counts).forEach(([cat, n]) => {
    const label = (categoryLabels && categoryLabels[cat]) || cat;
    chips.push(
      `<div class="filter-chip" data-filter="${escapeHtml(cat)}">${escapeHtml(label)} <span class="count">${n}</span></div>`
    );
  });
  bar.innerHTML = `<span class="filter-label">Filter</span>` + chips.join('');

  const chipEls = bar.querySelectorAll('.filter-chip');
  chipEls.forEach(chip => {
    chip.addEventListener('click', () => {
      chipEls.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      const f = chip.dataset.filter;
      document.querySelectorAll('.agent-card').forEach(card => {
        if (f === 'all' || card.dataset.cat === f) card.classList.remove('hidden');
        else card.classList.add('hidden');
      });
    });
  });
}

/* =========================================================
   Main grid renderer
   ========================================================= */
function renderGrid(apps) {
  document.getElementById('content').innerHTML = `
    <div class="agent-grid" id="agentGrid">
      ${apps.map(renderCard).join('')}
    </div>`;
}

/* =========================================================
   Error renderer
   ========================================================= */
function renderError(err) {
  document.getElementById('content').innerHTML = `
    <div class="error-box">
      <h3>⚠ apps.json을 불러올 수 없습니다</h3>
      <p>
        에러: <code>${escapeHtml(err.message || String(err))}</code><br><br>
        가능한 원인:<br>
        1. <code>apps.json</code> 파일이 같은 폴더에 없음<br>
        2. 로컬에서 <code>file://</code>로 열어서 브라우저가 fetch를 차단<br>
        &nbsp;&nbsp;&nbsp;→ 해결: 터미널에서 <code>python -m http.server</code> 실행 후 <code>localhost:8000</code> 접속<br>
        3. JSON 문법 오류 (콤마·따옴표 누락 등)
      </p>
    </div>`;
  document.getElementById('appBadge').textContent = 'Error';
}

/* =========================================================
   Bootstrap
   ========================================================= */
async function init() {
  try {
    const res = await fetch('apps.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const data = await res.json();
    if (!data.apps || !Array.isArray(data.apps)) {
      throw new Error('apps 배열이 없습니다');
    }
    renderStats(data.apps);
    renderFilters(data.apps, data.category_labels);
    renderGrid(data.apps);
  } catch (err) {
    console.error(err);
    renderError(err);
  }
}

init();
</script>
